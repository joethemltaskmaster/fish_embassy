<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__brand-mark">R</span>
    <span class="sidebar__brand-text">RAO Fish Embassy</span>
  </div>

  <nav class="sidebar__nav">
    <a href="{% url 'dashboard_index' %}"
       class="sidebar__link {% if active_section == 'dashboard' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">▤</span>
      <span>Dashboard</span>
    </a>
    <a href="{% url 'inventory:index' %}"
       class="sidebar__link {% if active_section == 'inventory' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">▦</span>
      <span>Inventory</span>

    <a href="{% url 'purchasing:index' %}"

      <span>Purchasing</span>
    </a>

    {% if perms.sales.add_sale %}
    <a href="{% url 'sales:index' %}"
       class="sidebar__link {% if active_section == 'sales' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">⬆</span>
      <span>Sales</span>

    {% if perms.costing.view_reports %}

       class="sidebar__link {% if active_section == 'reports' %}is-active{% endif %}">
      <span class="sidebar__icon" aria-hidden="true">▥</span>
