<header class="topbar">
  <div class="topbar__left">
    <button type="button" class="topbar__menu-btn" aria-label="Toggle navigation" aria-expanded="false">
      ☰
    </button>
  </div>
  <div class="topbar__right">
    {% if user.is_authenticated %}
      <span class="topbar__user">
        Signed in as <strong>{{ user.get_username }}</strong>
        {% if user.is_superuser %}<span class="badge badge--success">Superuser</span>{% endif %}
      </span>
      <form method="post" action="{% url 'logout' %}" class="inline-form">
        {% csrf_token %}
        <button type="submit" class="btn btn--ghost btn--sm">Sign out</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}?next={{ request.path }}" class="btn btn--primary btn--sm">
        Sign in
      </a>
    {% endif %}
  </div>
</header>
