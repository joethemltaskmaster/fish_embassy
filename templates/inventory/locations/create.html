
{% extends "base.html" %}

{% block title %}Register Storage Location | RAO Fish Embassy{% endblock %}

{% block content %}

<header class="page-header">
    <div>
        <h1 class="page-title">Register Storage Location</h1>
        <p class="page-subtitle">
            Add a new freezer, cold room or storage location.
        </p>
    </div>
</header>

<section class="card">
    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {{ form.as_p }}

        <div class="form-actions">
            <button type="submit" class="btn btn--primary">
                Register Location
            </button>

            <a href="{% url 'inventory:locations' %}"
               class="btn btn--ghost">
                Cancel
            </a>
        </div>
    </form>
</section>

{% endblock %}
