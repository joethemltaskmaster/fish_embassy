{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — RAO Fish Embassy</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand__mark">R</span>
      <span class="auth-brand__text">RAO Fish Embassy</span>
    </div>

    <h1 class="auth-title">Sign in</h1>

    {% if form.errors %}
      <div class="message message--error" role="alert">
        Your username and password didn't match. Please try again.
      </div>
    {% endif %}

    {% if next and user.is_authenticated %}
      <div class="message message--warning" role="alert">
        Your account doesn't have access to that page.
      </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" id="id_username"
               class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password"
               class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primary" style="width: 100%;">Sign in</button>
    </form>
  </div>
</body>
</html>
